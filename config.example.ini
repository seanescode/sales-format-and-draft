[EMAIL_SETTINGS]

# Separate recipients with semicolons

recipients = joe.bloggs@example.com
cc_recipients = finance.manager@example.com; finance.team@example.com

subject = Latest sales report attached

[EMAIL_CONTENT]

# The email body can contain multiple lines.Indent additional lines to keep them as part of the body.

body = Hi Team,

    The latest sales report is attached.

    If you have any questions, please let me know.

    Kind Regards,
