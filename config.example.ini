[EXCEL_REPORT_FORMATTING]

# Separate multiple files (if have multiple) with semicolons
attachment_paths = C:\Users\your_username\Documents\Sales\sales_data.xlsx

sheet_name = Sales
bold_header = True
italic_font = True

# RGB colour: (Red, Green, Blue)
# Example: light pink
heading_colour = (241, 214, 236)
